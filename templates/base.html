<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}کلاس‌یار{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="/">کلاس‌<b>یار</b></a>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for('dashboard') }}">کلاس‌های من</a>
    <span>{{ current_user.name }} ({{ 'معلم' if current_user.role=='teacher' else 'دانش‌آموز' }})</span>
    <a href="{{ url_for('logout') }}">خروج</a>
  {% else %}
    <a href="{{ url_for('login') }}">ورود</a><a href="{{ url_for('register') }}">ثبت‌نام</a>
  {% endif %}
</nav>
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body></html>
